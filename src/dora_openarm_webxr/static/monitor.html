<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenArm VR monitor</title>
    <link rel="stylesheet" href="monitor.css">
  </head>
  <body>
    <header class="toolbar">
      <div>
        <h1>OpenArm VR monitor</h1>
        <p id="status" role="status" aria-live="polite">Connecting…</p>
      </div>
      <div class="actions">
        <div id="eye-controls" class="eye-controls" hidden>
          <button type="button" data-layout="left">Left</button>
          <button type="button" data-layout="right" class="selected">Right</button>
          <button type="button" data-layout="split">Split</button>
        </div>
        <button id="fullscreen" type="button">Full screen</button>
      </div>
    </header>

    <main id="stage" class="stage">
      <div id="video-grid" class="video-grid" data-layout="right">
        <canvas id="left-video" class="video left" aria-label="Left camera"></canvas>
        <canvas id="right-video" class="video right" aria-label="Right camera"></canvas>
      </div>
      <p id="placeholder" class="placeholder">Waiting for a camera frame…</p>
      <div id="hud" class="hud" role="img" aria-label="Quest HUD"></div>
    </main>

    <script type="module" src="monitor.js"></script>
  </body>
</html>
